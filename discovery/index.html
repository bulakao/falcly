<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falcly — Discovery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #dee2e6;
      --hover: #e9ecef;
      --active: #e2e6ea;
      --code-bg: #f1f3f5;
    }
    body.dark {
      --bg: #0A0A0A;
      --surface: #141414;
      --text: #F0F0F0;
      --text-muted: #888888;
      --border: #2A2A2A;
      --hover: #1C1C1C;
      --active: #242424;
      --code-bg: #1C1C1C;
    }
    body { background: var(--bg); color: var(--text); margin: 0; overflow: hidden; }
    .sidebar { background: var(--surface) !important; border-color: var(--border) !important; }
    .nav-file { color: var(--text); }
    .nav-file:hover { background: var(--hover); }
    .nav-file.active { background: var(--active); }
    .nav-file .file-title { color: var(--text); }
    .content-area { color: var(--text); }
    .content-area h2 { border-color: var(--border); }
    .content-area th { background: var(--hover); border-color: var(--border); }
    .content-area td { border-color: var(--border); }
    .content-area tr:hover td { background: var(--hover); }
    .content-area blockquote { border-color: var(--border); color: var(--text-muted); }
    .content-area code { background: var(--code-bg); }
    .content-area pre { background: var(--code-bg); }
    .content-area hr { border-color: var(--border); }
    #themeToggle { border-color: var(--border); color: var(--text); background: var(--surface); }
    .nav-file { cursor: pointer; padding: 10px 14px; border-radius: 8px; transition: background .15s; font-size: 13px; line-height: 1.4; }
    .nav-file .file-num { color: var(--text-muted); font-size: 11px; font-weight: 700; margin-right: 6px; }
    .nav-file.active { font-weight: 600; }
    .content-area { overflow-y: auto; height: calc(100vh - 1rem); padding: 32px 40px; }
    .content-area h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    .content-area h2 { font-size: 1.25rem; font-weight: 700; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .content-area h3 { font-size: 1.05rem; font-weight: 600; margin-top: 20px; }
    .content-area table { width: 100%; font-size: 13px; margin: 12px 0; }
    .content-area th { font-weight: 600; padding: 8px 10px; border: 1px solid var(--border); white-space: nowrap; }
    .content-area td { padding: 6px 10px; border: 1px solid var(--border); vertical-align: top; }
    .content-area blockquote { border-left: 3px solid var(--border); padding-left: 14px; margin: 12px 0; font-size: 13px; }
    .content-area code { padding: 2px 5px; border-radius: 3px; font-size: 12px; }
    .content-area pre { padding: 14px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
    .content-area hr { border-top: 1px solid var(--border); margin: 24px 0; }
    .content-area ul, .content-area ol { padding-left: 20px; }
    .content-area li { margin-bottom: 4px; font-size: 14px; }
    .content-area p { font-size: 14px; line-height: 1.65; }
    .content-area strong { font-weight: 600; }
    .sidebar { overflow-y: auto; height: calc(100vh - 1rem); padding: 20px 14px; position: relative; }
    .sidebar-title { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 0 14px 12px; }
    .loading { text-align: center; padding: 60px 20px; color: #adb5bd; }
  </style>
</head>
<body>
  <div class="container-fluid p-2">
    <div class="row g-0">
      <div class="col-3 rounded-5 bg-white shadow sidebar">
        <div class="sidebar-title">Discovery</div>
        <button id="themeToggle" onclick="toggleTheme()" style="position:absolute;top:16px;right:16px;background:none;border:1px solid #dee2e6;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer">🌙</button>
        <div id="fileList" class="d-flex flex-column gap-1"></div>
      </div>
      <div class="col-9 content-area" id="content">
        <div class="loading">Select a file to read</div>
      </div>
    </div>
  </div>

  <script>
    const files = [
      { num: '00', file: '00-BRIEF.md', title: 'Brief' },
      { num: '01', file: '01-market-research.md', title: 'Market Research' },
      { num: '02', file: '02-competitor-deep-dive.md', title: 'Competitor Deep Dive' },
      { num: '03', file: '03-feature-matrix.md', title: 'Feature Matrix' },
      { num: '04', file: '04-icp.md', title: 'Ideal Customer Profile' },
      { num: '05', file: '05-keywords-seo-aso.md', title: 'Keywords & SEO/ASO' },
      { num: '06', file: '06-pricing-validation.md', title: 'Pricing Validation' },
      { num: '07', file: '07-go-to-market.md', title: 'Go-to-Market' },
      { num: '08', file: '08-regulatory-landscape.md', title: 'Regulatory Landscape' },
      { num: '09', file: '09-discovery-summary.md', title: 'Discovery Summary' },
      { num: '10', file: '10-payment-intelligence.md', title: 'Payment Intelligence' },
      { num: '11', file: '11-branding.md', title: 'Branding' },
      { num: '12', file: '12-financial-projections.md', title: 'Financial Projections' },
      { num: '13', file: '13-decision-logic.md', title: 'Decision Logic' },
      { num: '14', file: '14-ai-layer.md', title: 'AI Layer' },
      { num: '16', file: '16-tech-stack.md', title: 'Tech Stack' },
      { num: '17', file: '17-ux-patterns.md', title: 'UX Patterns' },
      { num: '18', file: '18-monetization.md', title: 'Monetization' }
    ];

    const fileList = document.getElementById('fileList');
    const content = document.getElementById('content');
    let activeIndex = -1;

    files.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'nav-file';
      el.innerHTML = `<span class="file-num">${f.num}</span><span class="file-title">${f.title}</span>`;
      el.addEventListener('click', () => loadFile(i));
      fileList.appendChild(el);
    });

    async function loadFile(index) {
      activeIndex = index;
      document.querySelectorAll('.nav-file').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      content.innerHTML = '<div class="loading">Loading...</div>';
      try {
        const res = await fetch(files[index].file);
        if (!res.ok) throw new Error('File not found');
        const md = await res.text();
        content.innerHTML = marked.parse(md);
        content.scrollTop = 0;
      } catch (e) {
        content.innerHTML = `<div class="loading">Could not load ${files[index].file}</div>`;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        if (activeIndex < files.length - 1) loadFile(activeIndex + 1);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        if (activeIndex > 0) loadFile(activeIndex - 1);
      }
    });

    loadFile(0);

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark');
      document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    // Restore theme on load
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
      document.getElementById('themeToggle').textContent = '☀️';
    }
  </script>
</body>
</html>
